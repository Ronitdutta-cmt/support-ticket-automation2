name: Deploy to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress package

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          IMAGE_NAME: support-ticket-automation
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Configure and deploy App Service container
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/support-ticket-automation:${{ github.sha }}
        run: |
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings WEBSITES_PORT=8080
          az webapp config container set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --docker-custom-image-name "$IMAGE" \
            --docker-registry-server-url "https://${{ vars.AZURE_ACR_LOGIN_SERVER }}"
          az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
